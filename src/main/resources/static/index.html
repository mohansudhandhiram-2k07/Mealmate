<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MessMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>MessMate</h1>
      <p>What's on the plate this week, and how it went down.</p>
    </div>
    <div class="switch" role="tablist" aria-label="Who is using this">
      <button role="tab" data-act="view" data-view="resident" aria-selected="true">Resident</button>
      <button role="tab" data-act="view" data-view="committee" aria-selected="false">Committee</button>
    </div>
  </header>

  <div class="weekbar">
    <button class="icon" data-act="prev" aria-label="Previous week">&#8249;</button>
    <strong id="weekLabel"></strong>
    <button class="icon" data-act="next" aria-label="Next week">&#8250;</button>
    <button class="ghost" data-act="thisWeek">This week</button>
  </div>

  <main>
    <section id="v-resident"></section>

    <section id="v-committee" hidden>
      <div id="glance" class="glance"></div>
      <nav class="tabs" aria-label="Committee sections">
        <button data-act="tab" data-tab="ratings">Ratings</button>
        <button data-act="tab" data-tab="headcount">Headcount</button>
        <button data-act="tab" data-tab="menu">Publish menu</button>
        <button data-act="tab" data-tab="residents">Residents</button>
        <button data-act="tab" data-tab="search">Find a dish</button>
      </nav>
      <div id="cbody"></div>
    </section>
  </main>

  <dialog id="rateDlg">
    <form id="rateForm" method="dialog">
      <h2 id="rateTitle"></h2>
      <p id="rateItems" class="dim"></p>
      <div class="picks" id="picks" role="radiogroup" aria-label="Rating out of 5"></div>
      <label class="field">Anything to add? (optional)
        <textarea id="rateComment" maxlength="500" rows="3" placeholder="Too salty, undercooked, really good..."></textarea>
      </label>
      <p id="rateErr" class="err" role="alert"></p>
      <div class="row">
        <button type="submit" class="primary" id="rateSave">Save rating</button>
        <button type="button" class="ghost" data-act="rateCancel">Cancel</button>
        <button type="button" class="danger" id="rateRemove" data-act="unrate" hidden>Remove rating</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
